<!doctype html>
<html lang="en" class="wa-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LogLadder Console</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <svg viewBox="0 0 256 256" aria-hidden="true"><path fill="#F6F5F1" d="M40 40h56v26H66v124h30v26H40z M216 40h-56v26h30v124h-30v26h56z M102 116h36a12 12 0 0 1 0 24h-36a12 12 0 0 1 0-24z M102 154h64a12 12 0 0 1 0 24h-64a12 12 0 0 1 0-24z"/><path fill="#8B78FF" d="M90 90a12 12 0 1 0 24 0a12 12 0 1 0-24 0z"/></svg>
        <span>LogLadder</span>
      </div>
      <nav class="roles" id="roles" aria-label="Role"></nav>
      <div class="spacer"></div>
      <span class="scope" id="scope" hidden></span>
      <span class="counter" id="receiptCount" title="Receipts this session" hidden></span>
      <span class="claims unchecked" id="claims" tabindex="0"></span>
      <wa-tooltip for="claims" id="claimsTip" placement="bottom-end"></wa-tooltip>
      <span class="conn" id="conn" title="Connecting…"></span>
    </header>
    <div class="banner" id="banner" hidden>Reconnecting to the console server…</div>

    <wa-split-panel class="main" id="mainSplit" position="58">
      <section slot="start" class="term-pane" aria-label="Claude Code terminal">
        <div class="term-host" id="termHost"></div>
        <div class="term-overlay" id="termOverlay" hidden></div>
      </section>
      <wa-split-panel slot="end" orientation="vertical" position="62" class="side">
        <section slot="start" class="panel evidence" id="evidence" aria-label="Evidence">
          <div class="phead">
            <span class="kind" id="evKind"></span>
            <h2 class="ptitle" id="evTitle">Evidence</h2>
            <span class="count" id="evCount"></span>
            <span class="trunc" id="evTrunc" hidden></span>
            <span id="evChip"></span>
          </div>
          <div class="pbody" id="evBody" tabindex="-1"></div>
          <div class="pfoot" id="evFoot" hidden>
            <button class="nav" id="evPrev" aria-label="Previous evidence"></button>
            <div class="dots" id="evDots"></div>
            <button class="nav" id="evNext" aria-label="Next evidence"></button>
            <button class="live" id="evLive">LIVE</button>
          </div>
        </section>
        <section slot="end" class="panel explainer" id="explainer" aria-label="Explainer">
          <div class="phead">
            <span class="kind" id="xpKind"></span>
            <h2 class="ptitle" id="xpTitle">Explainer</h2>
          </div>
          <div class="pbody md" id="xpBody"></div>
        </section>
      </wa-split-panel>
    </wa-split-panel>

    <wa-drawer id="drawer" placement="end" light-dismiss></wa-drawer>
    <div class="tooltip-float" id="chartTip" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
