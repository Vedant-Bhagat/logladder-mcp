services:
  serenedb:
    image: serenedb/serenedb
    container_name: loglad-serenedb
    ports:
      - "7890:7890"
    volumes:
      - serenedb-data:/var/lib/serenedb
      - ../data:/data:ro
    environment:
      POSTGRES_PASSWORD: loglad  # local demo only; Docker port-forwarding isn't loopback, so trust doesn't apply
    restart: unless-stopped

volumes:
  serenedb-data:
